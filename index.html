<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青禾 · 数智化服务平台 — 培养总览</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#F3F6F4;
  --surface:#FFFFFF;
  --surface-2:#F8FAF8;
  --ink:#1C2B23;
  --ink-2:#5B6D62;
  --ink-3:#96A49B;
  --line:#E4EBE6;
  --brand:#1F8A5B;
  --brand-deep:#14603F;
  --brand-soft:#E5F3EB;
  --brand-softer:#F0F8F3;
  --amber:#B45309;
  --amber-bg:#FDF3E0;
  --amber-line:#F3DFB8;
  --blue:#2E6FBF;
  --blue-bg:#EAF2FC;
  --orange:#C65F1E;
  --orange-bg:#FCF0E7;
  --green:#1F8A5B;
  --green-bg:#E5F3EB;
  --shadow-s:0 1px 2px rgba(28,43,35,.04),0 2px 8px rgba(28,43,35,.05);
  --shadow-m:0 4px 16px rgba(28,43,35,.08),0 2px 6px rgba(28,43,35,.05);
  --shadow-l:0 16px 48px rgba(28,43,35,.16);
  --r-sm:10px;--r-md:14px;--r-lg:18px;
  --font-sans:"MiSans","HarmonyOS Sans SC","PingFang SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-num:Georgia,"Times New Roman","Songti SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
/* ============ 布局骨架 ============ */
.app{display:flex;height:100vh}
.sidebar{
  width:236px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  padding:20px 14px 16px;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#2BAE73,#14603F);
  color:#fff;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(31,138,91,.3);
}
.brand-name{font-size:17px;font-weight:700;letter-spacing:.5px}
.brand-slogan{font-size:9.5px;color:var(--ink-3);letter-spacing:2.6px;margin-top:1px}
.nav-label{font-size:11px;color:var(--ink-3);padding:6px 12px 8px;letter-spacing:1px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--r-sm);
  color:var(--ink-2);font-size:13.5px;font-weight:500;
  transition:background .18s,color .18s;position:relative;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.75}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.nav-item.active svg{opacity:1;color:var(--brand)}
.badge{
  margin-left:auto;min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--amber-bg);color:var(--amber);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.sidebar-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line)}
.foot-quote{font-size:12px;color:var(--ink-2);font-style:italic;padding-bottom:10px}
.foot-quote b{color:var(--brand-deep);font-weight:700}
.foot-meta{font-size:11px;color:var(--ink-3);padding-bottom:10px;line-height:1.5}
.reset-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:8px;border-radius:var(--r-sm);border:1px dashed var(--line);
  color:var(--ink-2);font-size:12px;transition:all .18s;
}
.reset-btn:hover{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-softer)}
.reset-btn svg{width:13px;height:13px}
.backup-row{display:flex;gap:8px;margin-bottom:8px}
.backup-row .reset-btn{flex:1;padding:7px 4px;font-size:11px;white-space:nowrap}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:56px;flex-shrink:0;
  background:rgba(255,255,255,.82);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 28px;gap:14px;
  position:relative;z-index:60;
}
.crumb{font-size:12.5px;color:var(--ink-3)}
.crumb b{color:var(--ink-2);font-weight:500}
.crumb .sep{margin:0 8px;color:var(--line)}
.crumb .cur{color:var(--brand-deep);font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-tag{
  font-size:10.5px;letter-spacing:1px;padding:3px 9px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand-deep);font-weight:600;border:1px solid #CDE8D9;
}
/* 岗位模式切换 */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg-btn{
  padding:5px 14px;border-radius:999px;font-size:12px;color:var(--ink-2);
  font-weight:500;transition:all .2s;white-space:nowrap;
}
.seg-btn:hover{color:var(--ink)}
.seg-btn.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(31,138,91,.3)}
.seg-divider{width:1px;height:18px;background:var(--line);align-self:center}
.view-switch{position:relative}
.vs-btn{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:12.5px;color:var(--ink);transition:all .18s;
}
.vs-btn:hover{border-color:var(--brand)}
.vs-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.vs-btn svg{width:12px;height:12px;color:var(--ink-3)}
.vs-menu{
  position:absolute;right:0;top:calc(100% + 6px);min-width:180px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-m);padding:6px;display:none;z-index:50;
}
.vs-menu.open{display:block;animation:popIn .16s ease}
.vs-opt{
  width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2);
}
.vs-opt:hover{background:var(--brand-softer);color:var(--ink)}
.vs-opt .sub{font-size:11px;color:var(--ink-3);display:block}
.avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#2BAE73,#14603F);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.content{flex:1;overflow-y:auto;padding:30px 34px 90px;scroll-behavior:smooth}
.view{display:none;animation:fadeUp .35s ease both}
.view.active{display:block}
/* ============ 培养总览 ============ */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
.hero-eyebrow{
  font-size:10.5px;letter-spacing:3px;color:var(--brand);
  font-weight:700;margin-bottom:8px;
}
.hero h1{font-size:30px;font-weight:750;letter-spacing:.5px;line-height:1.25}
.hero .sub{font-size:13.5px;color:var(--ink-2);margin-top:6px}
.hero-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}
.btn-primary{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--brand);color:#fff;font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:999px;box-shadow:0 6px 16px rgba(31,138,91,.28);
  transition:all .2s;
}
.btn-primary:hover{background:var(--brand-deep);transform:translateY(-1px)}
.btn-primary svg{width:14px;height:14px}
.weekbar{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-s);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;margin-bottom:26px;
}
.weekbar .lbl{font-size:13px;color:var(--ink-2)}
.weekbar .lbl b{color:var(--ink);font-weight:600}
.weekbar .range{font-size:12px;color:var(--ink-3);margin-top:1px}
.stats{display:flex;gap:10px}
.stat{
  display:flex;align-items:baseline;gap:6px;
  padding:7px 14px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);cursor:pointer;transition:all .18s;
}
.stat:hover{border-color:var(--brand);background:var(--brand-softer)}
.stat.on{border-color:var(--brand);background:var(--brand-soft)}
.stat .n{font-family:var(--font-num);font-size:19px;font-weight:700;color:var(--ink)}
.stat .t{font-size:12px;color:var(--ink-2)}
.stat.amber .n{color:var(--amber)}
.stat.blue .n{color:var(--blue)}
.sect-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.sect-head h2{font-size:19px;font-weight:700}
.sect-head .h2sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.sect-head .note{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.sect-head .note svg{width:13px;height:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-s);padding:22px;display:flex;flex-direction:column;gap:14px;
  transition:transform .22s,box-shadow .22s;position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-m)}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--brand),#7FD3AC);opacity:0;transition:opacity .22s;
}
.card:hover::before{opacity:1}
.card-top{display:flex;align-items:center;gap:12px}
.p-avatar{
  width:44px;height:44px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#E5F3EB,#CDE8D9);color:var(--brand-deep);
  font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.card-top .who{min-width:0}
.who .nm{font-size:15.5px;font-weight:700}
.who .role{font-size:12px;color:var(--ink-3);margin-top:1px}
.phase-pill{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;background:var(--brand-softer);
  font-size:11.5px;color:var(--brand-deep);font-weight:600;white-space:nowrap;
}
.phase-pill .pdot{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.phasebar{display:flex;gap:5px;margin-top:9px}
.phasebar i{
  flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative;
}
.phasebar i.on{background:var(--brand)}
.phasebar i.half::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:55%;background:var(--brand);border-radius:2px;
}
.phase-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:5px}
.phase-meta b{color:var(--ink-2);font-weight:600}
.goal{background:var(--surface-2);border-radius:var(--r-sm);padding:11px 13px}
.goal .gl{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px;margin-bottom:4px}
.goal .gl svg{width:12px;height:12px}
.goal p{font-size:13px;font-weight:600;color:var(--ink);line-height:1.5}
.task-row{
  display:flex;align-items:center;gap:9px;padding:10px 13px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
}
.task-row .tt{flex:1;min-width:0;font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.45}
.tag{flex-shrink:0;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.doing{background:var(--blue-bg);color:var(--blue)}
.tag.review{background:var(--orange-bg);color:var(--orange)}
.tag.done{background:var(--green-bg);color:var(--green)}
.mini-btn{
  flex-shrink:0;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;
  border:1px solid var(--brand);color:var(--brand-deep);transition:all .18s;
}
.mini-btn:hover{background:var(--brand);color:#fff}
.progress-line{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}
.progress-line svg{width:12px;height:12px;color:var(--brand)}
.progress-line b{color:var(--brand-deep);font-weight:600}
.support-block{
  background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:var(--r-sm);
  padding:10px 13px;display:flex;align-items:center;gap:10px;
}
.support-block .q{
  width:20px;height:20px;border-radius:50%;background:var(--amber);color:#fff;flex-shrink:0;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.support-block .st{flex:1;font-size:12px;color:#7A4E0E;line-height:1.45}
.support-block.resolved{background:var(--green-bg);border-color:#CDE8D9}
.support-block.resolved .q{background:var(--green)}
.support-block.resolved .st{color:var(--brand-deep)}
.card-foot{
  margin-top:auto;display:flex;align-items:center;justify-content:space-between;
  padding-top:12px;border-top:1px dashed var(--line);
}
.meeting{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.meeting svg{width:13px;height:13px;color:var(--brand)}
.meeting b{color:var(--ink);font-weight:600}
.archive-link{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  color:var(--brand-deep);transition:gap .18s;
}
.archive-link:hover{gap:8px}
.archive-link svg{width:12px;height:12px}
.filter-hint{font-size:12px;color:var(--ink-3);padding:6px 2px 0}
.filter-hint a{color:var(--brand-deep);cursor:pointer;text-decoration:underline}
/* ============ 成长任务视图 ============ */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{
  padding:7px 16px;border-radius:999px;font-size:12.5px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);transition:all .18s;font-weight:500;
}
.tab:hover{border-color:var(--brand)}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.task-list{display:flex;flex-direction:column;gap:12px}
.task-item{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-s);padding:16px 18px;display:flex;align-items:center;gap:16px;
  transition:box-shadow .18s;
}
.task-item:hover{box-shadow:var(--shadow-m)}
.task-item .ti-ava{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#E5F3EB,#CDE8D9);color:var(--brand-deep);
  font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;
}
.task-item .ti-main{flex:1;min-width:0}
.task-item .ti-title{font-size:13.5px;font-weight:600}
.task-item .ti-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:10px}
.task-item .ti-meta b{color:var(--ink-2);font-weight:600}
/* ============ 个人成长视图 ============ */
.profile-wrap{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.pick-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;box-shadow:var(--shadow-s)}
.pick-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-sm);
  transition:background .15s;text-align:left;
}
.pick-item:hover{background:var(--surface-2)}
.pick-item.active{background:var(--brand-soft)}
.pick-item .p-avatar{width:36px;height:36px;border-radius:11px;font-size:14px}
.pick-item .pi{min-width:0}
.pick-item .pi b{display:block;font-size:13px}
.pick-item .pi span{font-size:11px;color:var(--ink-3)}
.pick-item .ph{margin-left:auto;font-size:11px;color:var(--brand-deep);font-weight:700}
.panel{display:flex;flex-direction:column;gap:18px}
.panel-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-s);padding:20px 22px;
}
.panel-card h3{font-size:14.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel-card h3 svg{width:15px;height:15px;color:var(--brand)}
.pf-head{display:flex;align-items:center;gap:16px;padding:6px 2px}
.pf-head .p-avatar{width:56px;height:56px;border-radius:18px;font-size:22px}
.pf-head .nm{font-size:20px;font-weight:750}
.pf-head .meta{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.pf-head .meta span{display:inline-flex;align-items:center;gap:4px}
.pf-head .meta svg{width:12px;height:12px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:1px}
.tl-item{position:relative;padding:0 0 16px 6px}
.tl-item::before{
  content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:3px solid var(--brand);
}
.tl-item.past::before{border-color:var(--brand-soft)}
.tl-item .tw{font-size:11px;color:var(--brand-deep);font-weight:700;letter-spacing:.5px}
.tl-item .tt{font-size:13px;font-weight:600;margin-top:1px}
.tl-item .td{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.tl-item .tcur{display:inline-block;font-size:10.5px;background:var(--brand);color:#fff;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.m1on1{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.m1on1:last-child{border-bottom:none;padding-bottom:0}
.m1on1 .d{font-family:var(--font-num);font-size:15px;font-weight:700;color:var(--brand-deep);width:52px;flex-shrink:0}
.m1on1 .c{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.m1on1 .c b{color:var(--ink);font-weight:600}
.skill-row{display:flex;align-items:center;gap:12px;padding:7px 0}
.skill-row .sn{width:72px;font-size:12px;color:var(--ink-2);font-weight:600;flex-shrink:0}
.skill-row .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.skill-row .bar i{
  display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#2BAE73,var(--brand-deep));
  transition:width .8s cubic-bezier(.2,.8,.2,1);
}
.skill-row .sv{width:26px;text-align:right;font-family:var(--font-num);font-size:13px;font-weight:700;color:var(--brand-deep)}
.skill-legend{font-size:11px;color:var(--ink-3);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
/* ============ 沟通与支持 ============ */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.plain-list{display:flex;flex-direction:column;gap:10px}
.plain-row{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-s);
}
.plain-row .ic{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:var(--brand-softer);color:var(--brand-deep);
}
.plain-row .ic svg{width:15px;height:15px}
.plain-row .pm{flex:1;min-width:0}
.plain-row .pm b{font-size:13px;font-weight:600}
.plain-row .pm span{font-size:11.5px;color:var(--ink-3);display:block}
/* ============ 阶段回顾 ============ */
.stage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stage-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--shadow-s);position:relative;
}
.stage-card .sn{font-family:var(--font-num);font-size:26px;font-weight:700;color:var(--line)}
.stage-card.done{border-color:#CDE8D9;background:var(--brand-softer)}
.stage-card.done .sn{color:var(--brand)}
.stage-card.cur{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.stage-card .sn2{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.stage-card.done .sn2{background:var(--green-bg);color:var(--green)}
.stage-card.cur .sn2{background:var(--brand);color:#fff}
.stage-card h4{font-size:14px;font-weight:700;margin:8px 0 5px}
.stage-card .desc{font-size:12px;color:var(--ink-2);line-height:1.55}
.stage-card .skills{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.stage-card .skills span{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.rule-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.rule-card{
  background:var(--brand-softer);border:1px solid #CDE8D9;border-radius:var(--r-md);
  padding:14px 16px;display:flex;gap:12px;align-items:flex-start;
}
.rule-card .rn{font-family:var(--font-num);font-size:20px;font-weight:700;color:var(--brand);line-height:1}
.rule-card .rt b{font-size:12.5px;color:var(--brand-deep);display:block;margin-bottom:3px}
.rule-card .rt span{font-size:11.5px;color:var(--ink-2);line-height:1.5;display:block}
/* ============ 组织看板（HR 视角） ============ */
.org-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.org-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 20px;box-shadow:var(--shadow-s);
}
.org-card .n{font-family:var(--font-num);font-size:30px;font-weight:700;color:var(--brand-deep);line-height:1.1}
.org-card .t{font-size:12px;color:var(--ink-2);margin-top:3px}
.org-card .d{font-size:11px;color:var(--ink-3);margin-top:1px}
.org-card.warn .n{color:var(--amber)}
.org-card.blue .n{color:var(--blue)}
.org-rows{display:flex;flex-direction:column;gap:9px}
.org-row{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;box-shadow:var(--shadow-s);
}
.org-row .ot{flex:1;min-width:0}
.org-row .ot b{font-size:13px;font-weight:600}
.org-row .ot span{font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px}
.org-row .ot .ot-desc{font-size:11px;color:var(--ink-2);line-height:1.5;margin-top:3px;display:block}
.org-row .ot .job{
  display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;margin-left:6px;
  background:var(--brand-softer);color:var(--brand-deep);vertical-align:1px;font-weight:600;
}
.org-row .ot .job.dev{background:var(--blue-bg);color:var(--blue)}
.org-row .cnt{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.org-row .cnt b{font-family:var(--font-num);font-size:15px;font-weight:700;color:var(--ink)}
.org-row .cnt.amber b{color:var(--amber)}
.org-row .cnt.blue b{color:var(--blue)}
.dist-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 10px}
.dist-bar i{display:block;height:100%}
.dist-bar i.dev{background:var(--blue)}
.dist-bar i.product{background:var(--brand)}
.dist-legend{display:flex;gap:16px;font-size:11px;color:var(--ink-3)}
.dist-legend .li{display:flex;align-items:center;gap:5px}
.dist-legend .li i{width:9px;height:9px;border-radius:2px;display:inline-block}
/* ============ 转正准备 ============ */
.steps{display:flex;gap:0;margin:8px 0 22px}
.step{flex:1;position:relative;text-align:center;padding:0 8px}
.step .dot{
  width:34px;height:34px;border-radius:50%;margin:0 auto 8px;
  background:var(--surface);border:2px solid var(--line);color:var(--ink-3);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;
}
.step.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.step.cur .dot{border-color:var(--brand);color:var(--brand-deep);box-shadow:0 0 0 4px var(--brand-soft)}
.step::before{
  content:"";position:absolute;top:17px;left:calc(-50% + 17px);right:calc(50% + 17px);height:2px;background:var(--line);
}
.step:first-child::before{display:none}
.step.done::before,.step.done ~ .step::before{background:var(--brand)}
.step b{display:block;font-size:12px;color:var(--ink-2);font-weight:600}
.step span{font-size:10.5px;color:var(--ink-3)}
.ready-panel{
  background:linear-gradient(135deg,#F0F8F3,#E5F3EB);border:1px solid #CDE8D9;
  border-radius:var(--r-lg);padding:22px 24px;display:flex;align-items:center;gap:16px;
}
.ready-panel .rk{font-size:30px}
.ready-panel h3{font-size:16px;font-weight:700;color:var(--brand-deep)}
.ready-panel p{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.6}
.dim-row{
  display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);
}
.dim-row:last-child{border-bottom:none;padding-bottom:0}
.dim-row .dn{width:110px;flex-shrink:0}
.dim-row .dn b{font-size:13px;color:var(--ink)}
.dim-row .dn span{font-size:10.5px;color:var(--ink-3);display:block;margin-top:1px}
.dim-row .dw{width:46px;flex-shrink:0;font-family:var(--font-num);font-size:15px;font-weight:700;color:var(--brand-deep)}
.dim-row .dd{flex:1;font-size:12px;color:var(--ink-2);line-height:1.5}
/* ============ 转正考核 V2：三维度必要条件 ============ */
.ver-switch{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.ver-btn{padding:5px 14px;border-radius:999px;font-size:12px;color:var(--ink-2);font-weight:500;transition:all .2s;white-space:nowrap}
.ver-btn:hover{color:var(--ink)}
.ver-btn.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(31,138,91,.3)}
.dim3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.dim3-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-s);position:relative}
.dim3-card .dno{font-family:var(--font-num);font-size:26px;font-weight:700;color:var(--line);position:absolute;top:14px;right:16px}
.dim3-card .dic{width:34px;height:34px;border-radius:10px;background:var(--brand-softer);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.dim3-card .dic svg{width:16px;height:16px}
.dim3-card h4{font-size:14px;font-weight:700;margin-bottom:4px}
.dim3-card .desc{font-size:12px;color:var(--ink-2);line-height:1.6}
.dim3-card .req{margin-top:10px;font-size:11px;font-weight:600;color:var(--brand-deep);background:var(--brand-softer);display:inline-block;padding:2px 9px;border-radius:999px}
.check-list{display:flex;flex-direction:column;gap:10px}
.check-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 16px;box-shadow:var(--shadow-s)}
.check-item .cb{width:22px;height:22px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.check-item .cb.no{background:var(--surface-2);border:1.5px solid var(--line);color:transparent}
.check-item .cb.yes{background:var(--brand);color:#fff}
.check-item .cb.part{background:var(--amber-bg);border:1.5px solid var(--amber-line);color:var(--amber)}
.check-item .ct{flex:1;min-width:0}
.check-item .ct b{font-size:13px;font-weight:600}
.check-item .ct span{font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px}
.check-item .cp{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.check-item .cp b{font-family:var(--font-num);font-size:15px;font-weight:700}
.check-item .cp b.full{color:var(--brand)}
.check-item .cp b.warn{color:var(--amber)}
.check-item .cp em{font-style:normal;color:var(--ink-3);margin:0 2px}
.bonus{margin-top:14px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#FDF8EC,#FDF3E0);border:1px solid var(--amber-line);border-radius:var(--r-md);padding:13px 16px}
.bonus .bic{width:30px;height:30px;border-radius:9px;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.bonus .bt{font-size:12.5px;color:#7A4E0E;flex:1;line-height:1.55}
.bonus .bt b{color:var(--amber)}
.bonus .tag.done{flex-shrink:0}
.pt-pick{display:flex;align-items:center;gap:10px}
.pt-pick .pl{font-size:12px;color:var(--ink-2);font-weight:600}
.pt-pick select{
  padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;
  color:var(--ink);background:var(--surface);outline:none;cursor:pointer;
}
.pt-pick select:focus{border-color:var(--brand)}
/* ============ 实习生管理 ============ */
.mini-btn.danger{border-color:#E0B4A8;color:#B3543F}
.mini-btn.danger:hover{background:#B3543F;border-color:#B3543F;color:#fff}
.mg-list{display:flex;flex-direction:column}
.mg-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 18px;box-shadow:var(--shadow-s);margin-bottom:10px}
.mg-row .p-avatar{width:38px;height:38px;border-radius:12px;font-size:14px}
.mg-info{flex:1;min-width:0}
.mg-info b{font-size:13.5px}
.mg-info .mi{font-size:11.5px;color:var(--ink-3);margin-top:1px;display:flex;gap:10px;flex-wrap:wrap}
.mg-goal{flex:0 0 250px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.mg-goal span{display:block;font-size:10.5px;color:var(--ink-3);margin-bottom:1px}
.mg-ops{display:flex;gap:8px;flex-shrink:0}
.mg-empty{padding:50px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r-lg);font-size:12.5px}
/* 阶段/能力维度拖拽排序 */
.phase-drag,.skill-drag{cursor:grab;user-select:none;transition:border-color .15s,box-shadow .15s,opacity .15s}
.phase-drag:active,.skill-drag:active{cursor:grabbing}
.phase-drag.drag-on,.skill-drag.drag-on{opacity:.4;border-style:dashed;border-color:var(--brand)}
.phase-drag.drag-over,.skill-drag.drag-over{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.drag-handle{color:var(--ink-3);font-size:14px;cursor:grab;flex-shrink:0;padding:0 2px;letter-spacing:-2px}
.sort-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;border-radius:7px;background:var(--brand-softer);color:var(--brand-deep);font-family:var(--font-num);font-weight:700;font-size:12px;margin-right:8px;vertical-align:-1px}
.sort-hint{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.sort-hint svg{width:12px;height:12px;color:var(--brand);flex-shrink:0}
/* ============ 悬浮按钮 ============ */
.fab{
  position:fixed;right:30px;bottom:30px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#2BAE73,#14603F);color:#fff;
  box-shadow:0 10px 28px rgba(31,138,91,.4);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  transition:transform .2s,box-shadow .2s;z-index:40;
}
.fab:hover{transform:translateY(-3px) rotate(-6deg);box-shadow:0 14px 34px rgba(31,138,91,.5)}
.fab svg{width:20px;height:20px;margin-right:1px}
.fab .star{position:absolute;top:6px;right:7px;font-size:11px}
/* ============ Modal ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,35,28,.42);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-mask.open{display:flex;animation:fadeIn .2s ease}
.modal{
  background:var(--surface);border-radius:20px;width:520px;max-width:100%;
  box-shadow:var(--shadow-l);padding:26px 28px;animation:popIn .24s cubic-bezier(.2,.9,.3,1.2);
}
.modal h3{font-size:17px;font-weight:750;margin-bottom:4px}
.modal .msub{font-size:12px;color:var(--ink-3);margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field label .req{color:var(--orange)}
.field input,.field select,.field textarea{
  width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:13px;color:var(--ink);outline:none;transition:border .18s,box-shadow .18s;background:var(--surface);
}
.field textarea{resize:vertical;min-height:72px}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,138,91,.14);
}
.rate-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.rate-row .rl{width:96px;font-size:12.5px;color:var(--ink-2);font-weight:600;flex-shrink:0}
.rate-row .rs{display:flex;gap:6px}
.rate-row .rs button{
  width:34px;height:30px;border-radius:8px;border:1px solid var(--line);
  font-size:12px;color:var(--ink-3);transition:all .15s;
}
.rate-row .rs button:hover{border-color:var(--brand);color:var(--brand)}
.rate-row .rs button.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.modal-ft{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.btn-ghost{padding:9px 18px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink-2);transition:all .18s}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-primary.sm{padding:9px 20px;font-size:13px}
/* ============ Toast ============ */
#toasts{position:fixed;top:20px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;
  box-shadow:var(--shadow-l);display:flex;align-items:center;gap:9px;animation:slideIn .3s ease;
}
.toast .tk{width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast.out{animation:slideOut .3s ease forwards}
.placeholder{
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);
  padding:60px 30px;text-align:center;color:var(--ink-3);
}
.placeholder .pi{font-size:34px;margin-bottom:12px}
.placeholder b{display:block;font-size:15px;color:var(--ink-2);margin-bottom:6px}
.placeholder span{font-size:12.5px}
/* ============ 动画 ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(40px)}}
.stagger{opacity:0;animation:fadeUp .45s ease forwards}
.stagger:nth-child(1){animation-delay:.05s}
.stagger:nth-child(2){animation-delay:.12s}
.stagger:nth-child(3){animation-delay:.19s}
.stagger:nth-child(4){animation-delay:.26s}
.stagger:nth-child(5){animation-delay:.33s}
@media(max-width:1180px){.grid{grid-template-columns:repeat(2,1fr)}.stage-grid{grid-template-columns:repeat(2,1fr)}.duo{grid-template-columns:1fr}.rule-grid{grid-template-columns:1fr}}
@media(max-width:860px){
  .sidebar{display:none}
  .grid{grid-template-columns:1fr}
  .profile-wrap{grid-template-columns:1fr}
  .content{padding:20px 18px 80px}
}
/* ============ 登录页 ============ */
.login-mask{
  position:fixed;inset:0;z-index:300;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1100px 560px at 15% 0%,#E5F3EB 0%,#F3F6F4 50%,#EAF2EC 100%);
}
.login-card{
  width:410px;background:var(--surface);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-l);padding:38px 40px;
}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.login-brand .brand-mark{width:40px;height:40px;border-radius:12px;font-size:18px}
.login-card h1{font-size:24px;font-weight:750;letter-spacing:.5px}
.login-card .lg-sub{font-size:12px;color:var(--ink-3);margin:4px 0 24px}
.lg-btn{width:100%;justify-content:center;padding:11px;font-size:14px}
.lg-err{color:#C0392B;font-size:12px;margin-top:10px;min-height:18px}
.demo-accounts{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.demo-accounts .da-l{font-size:11px;color:var(--ink-3);margin-bottom:8px}
.demo-accounts .da-btns{display:flex;gap:8px}
.demo-accounts button{flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--line);font-size:11px;color:var(--ink-2);background:var(--surface-2);transition:all .15s}
.demo-accounts button:hover{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-softer)}
</style>
</head>
<body>
<div class="app">
  <!-- ============ 侧栏 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">青</div>
      <div>
        <div class="brand-name">青禾</div>
        <div class="brand-slogan">GROW TOGETHER</div>
      </div>
    </div>
    <div class="nav-label">成长工作台</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="foot-quote" id="footQuote">三个人，<b>各自向前一步</b>。</div>
      <div class="foot-meta" id="footMeta">数智化服务平台 · 双岗位培养<br>v0.5 · DEMO 原型</div>
      <div class="backup-row">
        <button class="reset-btn" onclick="exportData()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          导出数据备份
        </button>
        <button class="reset-btn" onclick="document.getElementById('importFile').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          导入备份
        </button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])">
      </div>
      <button class="reset-btn" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        重置示例数据
      </button>
    </div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">数智化服务平台 <span class="sep">/</span> <b>成长工作台</b> <span class="sep">/</span> <span class="cur">培养总览</span></div>
      <div class="topbar-right">
        <span class="demo-tag">DEMO · 示例数据</span>
        <!-- 岗位模式切换 -->
        <div class="seg" id="seg">
          <button class="seg-btn" data-role="dev">开发实习生</button>
          <button class="seg-btn active" data-role="product">产品实习生</button>
        </div>
        <div class="seg-divider"></div>
        <div class="view-switch" id="vs">
          <button class="vs-btn" id="vsBtn"><span class="dot"></span><span id="vsLabel">带教导师 · TL 视角</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="vs-menu" id="vsMenu">
            <button class="vs-opt" data-view="tl"><span class="vo-main">产品导师 · 产品视角</span><span class="sub">管理名下产品实习生培养</span></button>
            <button class="vs-opt" data-view="intern">实习生视角<span class="sub">查看个人成长轨迹</span></button>
            <button class="vs-opt" data-view="hr">组织管理 · HR 视角<span class="sub">跨岗位组织看板</span></button>

/* ================= 账号管理（HR） =================
   动态账号存 qinghe_accounts；新建实习生自动开号（姓名+5位随机数字，不重复） */
function getAccounts(){
  try{ const v = JSON.parse(localStorage.getItem('qinghe_accounts')||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; }
}
function saveAccounts(list){ localStorage.setItem('qinghe_accounts', JSON.stringify(list)); }
function genAccountUid(name){
  const list = getAccounts();
  const exists = new Set(list.map(a=>a.uid));
  let uid;
  do {
    const num = String(Math.floor(Math.random()*90000)+10000);   // 10000-99999
    uid = name + num;
  } while(exists.has(uid));
  return uid;
}
function openAccountForIntern(intern){
  const uid = genAccountUid(intern.name);
  const list = getAccounts();
  list.push({ uid, name: intern.name, role:'intern', job: intern.role || '产品', status:'active', auto:true, internId: intern.id, created: new Date().toISOString().slice(0,10) });
  saveAccounts(list);
  return uid;
}
function findAccount(uid){
  return getAccounts().find(a=>a.uid===uid);

/* ================= 数据持久化（升级不丢数据） =================
   存储结构带版本号；升级时按版本迁移、缺字段补默认，用户数据始终保留。
   每个岗位（dev/product）的数据独立保存，切换岗位互不覆盖。 */
const STORE_KEY = 'qinghe_state';
const SCHEMA_VERSION = 2;
const QUANT_DEF = { doc:0, clarify:0, cmp:0, ops:0, ai:0, flow:0, skill:false };
function defSkillsFor(job){
  return job==='dev'
    ? { code:1, debug:1, quality:1, doc:1, comm:1 }
    : { insight:1, design:1, data:1, doc:1, collab:1 };
}
function migrateIntern(i, job){
  return {
    ...i,
    skills: { ...defSkillsFor(job), ...(i.skills||{}) },
    quant: { ...QUANT_DEF, ...(i.quant||{}) },
    task: { ...(i.task || { title:'待分配 · 本周成长任务', status:'doing' }), week: (i.task && i.task.week) || 1 },
    progress: i.progress || { text:'', star:false },
    timeline: i.timeline || [],
    m1: i.m1 || [],
    progressLog: i.progressLog || [],
    joinDate: i.joinDate || '',
    gradDate: i.gradDate || '',
    school: i.school || '',
    degree: i.degree || '本科',
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    const jobs = { dev:null, product:null };
    (d.jobs||{}).dev && (jobs.dev = { interns:(d.jobs.dev.interns||[]).map(i=>migrateIntern(i,'dev')), custom:d.jobs.dev.custom||null });
    (d.jobs||{}).product && (jobs.product = { interns:(d.jobs.product.interns||[]).map(i=>migrateIntern(i,'product')), custom:d.jobs.product.custom||null });
    return {
      v: d.v||1,
      roleType: (d.roleType==='dev'||d.roleType==='product') ? d.roleType : 'product',
      roleView: ['tl','intern','hr'].includes(d.roleView) ? d.roleView : 'tl',
      curView: d.curView || 'overview',
      checkVer: (d.checkVer==='v1'||d.checkVer==='v2') ? d.checkVer : 'v2',
      jobs,
    };
  }catch(e){ return null; }
}
function saveState(){
  try{
    const data = {
      v: SCHEMA_VERSION,
      roleType, roleView, curView, checkVer,
      jobs: { dev:null, product:null },
    };
    // 当前岗位写当前 state；另一岗位保留历史数据（无历史则保持 null，切换时回落默认模型）
    data.jobs[roleType] = { interns: state.interns, custom: customByJob[roleType] };
    const prev = loadState();
    if(prev && prev.jobs){
      const other = roleType==='dev' ? 'product' : 'dev';
      if(prev.jobs[other]) data.jobs[other] = prev.jobs[other];
    }
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }catch(e){}
}
function switchJob(t){
  if(t===roleType) return;
  saveState();                       // 保存当前岗位数据
  const prev = loadState();
  const slot = prev && prev.jobs[t] ? prev.jobs[t] : null;
  roleType = t;
  if(slot){
    state.interns = slot.interns;
    customByJob[t] = slot.custom;
  } else {
    state = MODELS[t].seed();
    customByJob[t] = null;
  }
  curFilter='all'; taskTab='all'; internViewIdx=0;
  curView = roleView==='intern' ? 'profile' : 'overview';
  document.querySelectorAll('#seg .seg-btn').forEach(x=>x.classList.toggle('active', x.dataset.role===roleType));
  render();
  toast(`已切换为${MODELS[roleType].label}培养模式`);
}

/* ================= 模型配置（可配置化） =================
   customByJob：按岗位保存 HR 自定义的模型配置（阶段/晋升参数）
   未配置时回落到 MODELS 默认模型；重置示例数据时一并清除 */
let customByJob = { dev:null, product:null };
const _sorted = arr => arr.slice().sort((a,b)=>(a.sort??0)-(b.sort??0));
const getPhases = () => {
  const arr = (customByJob[roleType] && customByJob[roleType].phases) || MODELS[roleType].phases;
  return _sorted(arr);
};
const perJobPhases = job => {
  const arr = (customByJob[job] && customByJob[job].phases) || MODELS[job].phases;
  return _sorted(arr);
};
function getRules(){
  const base = M().promoteRules;
  const c = customByJob[roleType] && customByJob[roleType].params;
  if(!c) return base;
  return [
    { ...base[0], s:`本阶段成长任务验收 ≥ ${c.taskMin} 个，且无未闭环事项` },
    base[1],
    { ...base[2], s:`本阶段核心能力项导师评分 ≥ ${c.scoreMin}/5（5 分制）` },
  ];
}
function ensureCfg(){
  if(!customByJob[roleType]){
    customByJob[roleType] = {
      phases: MODELS[roleType].phases.map(p=>({...p, skills:[...p.skills]})),
      params: { taskMin:2, scoreMin:3 },
      footer: null,
      skillDims: MODELS[roleType].skillDims.map(d=>({...d})),
    };
  }
  return customByJob[roleType];
}
/* 能力维度（可配置）：名称/描述可增删改，影响个人成长能力图与阶段自评 */
const getSkillDims = () => {
  const c = customByJob[roleType] && customByJob[roleType].skillDims;
  return (c && c.length) ? c : M().skillDims;
};
/* 左下角描述（可配置）：品牌标语 / 平台描述 / 版本号 */
function getFooter(){
  const c = customByJob[roleType] && customByJob[roleType].footer;
  return c || { quote:'三个人，各自向前一步', meta:'数智化服务平台 · 双岗位培养', ver:'v0.5 · DEMO 原型' };
}
function renderFooter(){
  const f = getFooter();

  $('#footQuote').innerHTML = q.indexOf('向前一步')>=0 ? q.replace('向前一步','<b>向前一步</b>') : q;
  $('#footMeta').innerHTML = `${f.meta}<br>${f.ver}`;
}
function clampPhase(){
  const len = getPhases().length;
  state.interns.forEach(i=>{ if(i.phase>=len) i.phase=Math.max(0,len-1); });
}

/* 入职时间 → 自动计算入职周数（可手动修改）：入职当周为第 1 周
   手动修改过周数（weekTouched）后，入职时间变化不再覆盖手动值 */
let weekTouched = false;
function autoCalcWeek(){
  if(weekTouched) return;   // 用户已手动改过周数，尊重手动值
  const v = document.getElementById('imJoinDate');
  const w = document.getElementById('imWeek');
  if(!v || !w || !v.value) return;
  const days = Math.floor((Date.now() - new Date(v.value).getTime()) / 86400000);
  const calc = Math.max(1, Math.floor(days/7) + 1);
  w.value = calc;
}
function saveIntern(idx){
  const name=$('#imName').value.trim();
  const role=$('#imRole').value;
  const week=Math.min(52,Math.max(1,parseInt($('#imWeek').value)||1));
  const phase=parseInt($('#imPhase').value)||0;
  const joinDate=$('#imJoinDate').value||'';
  const gradDate=$('#imGradDate').value||'';
  const school=$('#imSchool').value.trim();
  const degree=$('#imDegree').value;
  const tl=$('#imTl').value.trim();
  if(!name){ toast('请填写姓名'); return; }
  if(!tl){ toast('请填写带教导师'); return; }
  if(idx>=0){
    const i=state.interns[idx];
    Object.assign(i,{name,role,week,phase,joinDate,gradDate,school,degree,tl});
    if(joinDate){ i.join = joinDate.slice(5).replace('-','.'); }
    toast(`已更新实习生：${name}`);
  } else {
    const ni=defaultIntern(name,role);
    ni.week=week; ni.phase=phase; ni.joinDate=joinDate||'2026-09-07'; ni.gradDate=gradDate; ni.school=school; ni.degree=degree; ni.tl=tl;
    ni.join = ni.joinDate.slice(5).replace('-','.');
    state.interns.push(ni);
    // 自动开通账号：姓名 + 5 位随机数字（不重复）
    const accUid = openAccountForIntern(ni);
    toast(`已添加实习生：${name}，账号 ${accUid}（默认密码 123456）`);
  }
  closeModal(); render();
}

/* ================= 阶段拖拽排序 ================= */
let dragFrom = -1;
function dragPhase(e){
  const row = e.target.closest('.phase-drag');
  if(!row) return;
  dragFrom = parseInt(row.dataset.idx);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragFrom));
  row.classList.add('drag-on');
}
function dragOverPhase(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const row = e.target.closest('.phase-drag');
  document.querySelectorAll('.phase-drag.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(row) row.classList.add('drag-over');
}
function dropPhase(e){
  e.preventDefault();
  const row = e.target.closest('.phase-drag');
  const to = row ? parseInt(row.dataset.idx) : -1;
  if(dragFrom>=0 && to>=0 && dragFrom!==to) reorderPhases(dragFrom, to);
  dragEndPhase();
}
function dragEndPhase(){
  dragFrom = -1;
  document.querySelectorAll('.phase-drag.drag-on,.phase-drag.drag-over').forEach(el=>el.classList.remove('drag-on','drag-over'));
}
function movePhase(idx, dir){
  const to = idx + dir;
  const len = getPhases().length;
  if(to<0 || to>=len || idx<0 || idx>=len) return;
  reorderPhases(idx, to);
}
function reorderPhases(from, to){
  const cfg = ensureCfg();
  const arr = cfg.phases;
  if(from<0 || from>=arr.length || to<0 || to>=arr.length || from===to) return;
  // 快照：重排前各实习生所处阶段名（按索引取）
  const oldNames = arr.map(p=>p.name);
  const internNames = state.interns.map(i=>oldNames[i.phase]);
  // 重排 + 重编号（排序字段 1..n）
  const [m] = arr.splice(from, 1);
  arr.splice(to, 0, m);
  arr.forEach((p,i)=>p.sort=i+1);
  // 重映射：实习生仍处于同名阶段（位置不变，只调整列表顺序）
  state.interns.forEach((i,ix)=>{
    const ni = arr.findIndex(p=>p.name===internNames[ix]);
    i.phase = ni>=0 ? ni : Math.max(0, arr.length-1);
  });
  render();
  toast('阶段顺序已调整，排序号已按从小到大更新');
}

function orgData(){
  // 跨岗位合并：当前岗位用实时数据（增删改联动），另一岗位用示例数据
  const cur = roleType;
  const other = cur==='dev' ? 'product' : 'dev';
  const curList = state.interns.map(i=>({...i, job:cur}));
  const otherList = MODELS[other].seed().interns.map(i=>({...i, job:other}));
  const all = [...curList, ...otherList];
  const review = all.filter(i=>i.task.status==='review').length;
  const need = all.filter(i=>i.support&&i.support.status==='pending').length;
  // 阶段分布（按各自岗位的阶段索引）
  const stageMap = {};
  all.forEach(i=>{
    const phName = perJobPhases(i.job)[Math.min(i.phase, perJobPhases(i.job).length-1)].name;
    stageMap[phName] = (stageMap[phName]||0)+1;
  });
  // 导师分组
  const mentors = {};
  all.forEach(i=>{
    if(!mentors[i.tl]) mentors[i.tl]={ name:i.tl, dev:0, prod:0, total:0, review:0, need:0 };
    const m=mentors[i.tl];
    i.job==='dev'?m.dev++:m.prod++;
    m.total++;
    if(i.task.status==='review') m.review++;
    if(i.support&&i.support.status==='pending') m.need++;
  });
  const devs = all.filter(i=>i.job==='dev').length;
  const pros = all.filter(i=>i.job==='product').length;
  return { all, devs, pros, review, need, stageMap, mentors:Object.values(mentors), inWindow:0 };
}

      : curView==='tasks'?taskListHTML()
      : curView==='profile'?profileHTML()
      : curView==='support'?supportHTML()
      : curView==='review'?reviewHTML()
      : curView==='org'?orgHTML()
      : curView==='manage'?manageHTML()
      : prepareHTML();
  }
  $('#content').innerHTML = html;
  renderNav();
  saveState();   // 数据变更后统一持久化，升级/刷新不丢数据
}

/* ================= 交互：阶段自评（实习生） ================= */

/* ================= 交互：新建任务 ================= */
function openNewTask(){
  openModal(`
    <h3>新建成长任务</h3>
    <div class="msub">任务应可验收、可观察，并服务于该周的成长目标；先选伙伴，再选任务所属周次</div>
    <div class="field"><label>任务标题 <span class="req">*</span></label><input id="ntTitle" placeholder="例如：${isDev()?'会话状态流转缺陷修复与回归':'AI 客服降级场景用户访谈与洞察整理'}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label>指派伙伴 <span class="req">*</span></label>
        <select id="ntWho" onchange="refreshTaskWeeks()">${state.interns.map(i=>`<option value="${i.id}">${i.name} · ${roleLabel(i.role)}（第${i.week}周）</option>`).join('')}</select>
      </div>
      <div class="field"><label>任务周次 <span class="req">*</span>（当前周起）</label>
        <select id="ntWeek"></select>
      </div>
    </div>
    <div class="field"><label>任务说明</label><textarea id="ntDesc" placeholder="说明验收标准、期望产出…"></textarea></div>
    <div class="modal-ft">
      <button class="btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn-primary sm" onclick="createTask()">创建任务</button>
    </div>`);
  refreshTaskWeeks();
  setTimeout(()=>$('#ntTitle').focus(),80);
}
/* 先选人 → 刷新该伙伴可选周次（当前周 ~ 第 12 周） */
function refreshTaskWeeks(){
  const who = $('#ntWho');
  const sel = $('#ntWeek');
  if(!who || !sel) return;
  const i = state.interns.find(x=>x.id===who.value);
  if(!i) return;
  const cur = Math.max(1, i.week);
  const opts = [];
  for(let w=cur; w<=52; w++){
    opts.push(`<option value="${w}" ${w===cur?'selected':''}>${w===cur?`第 ${w} 周（当前周）`:`第 ${w} 周`}</option>`);
  }
  sel.innerHTML = opts.join('');
}
function createTask(){
  const title=$('#ntTitle').value.trim();
  if(!title){ toast('请填写任务标题'); return; }
  const who=$('#ntWho').value;
  const week=parseInt($('#ntWeek').value)||1;
  const i=state.interns.find(x=>x.id===who);
  i.task={ title, status:'doing', week };
  closeModal(); render();
  toast(`成长任务已创建（第 ${week} 周）：${title}`);
}

/* ================= 数据备份：导出 / 导入 ================= */
function exportData(){
  saveState();
  const raw = localStorage.getItem(STORE_KEY) || '{}';
  const blob = new Blob([raw], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'qinghe-data-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('数据已导出为备份文件，请妥善保存');
}
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(!d || typeof d !== 'object' || !d.jobs || typeof d.jobs !== 'object'){
        throw new Error('数据格式不正确');
      }
      // 校验通过后写入并重载（缺失岗位在加载时自动回落默认模型）
      localStorage.setItem(STORE_KEY, JSON.stringify(d));
      toast('备份导入成功，正在恢复数据…');
      setTimeout(()=>location.reload(), 600);
    }catch(err){
      toast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
}

  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  state=MODELS[roleType].seed(); curFilter='all'; taskTab='all'; internViewIdx=0;

});

/* ================= 启动 ================= */
(function init(){
  // 登录态检查：已登录进入主界面，未登录停留在登录页
  const savedUser = loadUser();
  if(savedUser){
    loginUser = savedUser;
    const dyn = findAccount(savedUser.uid);
    roleView = dyn ? 'intern' : (savedUser.uid==='intern' ? 'intern' : savedUser.uid==='hr' ? 'hr' : 'tl');
    $('#loginMask').style.display = 'none';
  } else {
    roleView = 'tl';
  }
  const saved = loadState();
  if(saved){
    roleType = saved.roleType;
    curView = saved.curView;
    checkVer = saved.checkVer;
    if(roleView==='intern' && curView==='overview') curView='profile';
    if(roleView==='hr' && !['org','prepare','manage','config','profile','accounts'].includes(curView)) curView='org';
    const slot = saved.jobs[roleType];
    if(slot){
      state = { interns: slot.interns };
      customByJob[roleType] = slot.custom;
    } else {
      state = MODELS[roleType].seed();
    }
  }
  render();
})();
</script>
